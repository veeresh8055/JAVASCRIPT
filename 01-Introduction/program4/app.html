<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Particle Nebula</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #dad9d9ee; /* Deeper midnight blue */
        overflow: hidden;
      }

      #particle-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        border-radius: 50%;
        will-change: transform;
        /* Ensures the gradient looks smooth */
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <div id="particle-container"></div>

    <script>
      const container = document.getElementById("particle-container");
      const NUMBER_OF_PARTICLES = 600;
      const particles = [];

      let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      // Helper to generate a random gradient
      const getRandomGradient = () => {
        const colors = [
          ["#3b82f6", "#1d4ed8"], // Blue
          ["#fb923c", "#ea580c"], // Orange
          ["#a855f7", "#7e22ce"], // Purple
          ["#2dd4bf", "#0f766e"], // Teal
          ["#f43f5e", "#be123c"], // Rose
          ["#EAF5BC", "#68D66A"],
          ["#28B9D3", " #6795A4"],
          ["#28B9D3", "#6795A4"],
          ["#3B82F6", "#06B6D4"],
          ["#FB923C", "#F97316"],
          ["#8B5CF6", "#A78BFA"],
          ["#22C55E", "#86EFAC"],
          ["#0F172A", "#334155"],
        ];
        const pair = colors[Math.floor(Math.random() * colors.length)];
        return `radial-gradient(circle at 30% 30%, ${pair[0]}, ${pair[1]})`;
      };

      for (let i = 0; i < NUMBER_OF_PARTICLES; i++) {
        const el = document.createElement("div");
        const size = Math.random() * 1 + 2; // Slightly larger to show off gradients

        el.classList.add("particle");
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.background = getRandomGradient();

        container.appendChild(el);

        // Trigonometric spacing
        const angle = Math.random() * Math.PI * 2;
        const radius = 40 + Math.random() * 180;

        particles.push({
          element: el,
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: 0,
          vy: 0,
          angle: angle,
          radius: radius,
          rotationSpeed: (Math.random() - 0.5) * 0.015,
          friction: .8,
          ease: 0.0015 + Math.random() * 0.03,
        });
      }

      function animate() {
        particles.forEach((p) => {
          p.angle += p.rotationSpeed;

          // Target Position (Circle around cursor)
          const targetX = mouse.x + Math.cos(p.angle) * p.radius;
          const targetY = mouse.y + Math.sin(p.angle) * p.radius;

          // Physics
          const dx = targetX - p.x;
          const dy = targetY - p.y;

          p.vx += dx * p.ease;
          p.vy += dy * p.ease;
          p.vx *= p.friction;
          p.vy *= p.friction;
          p.x += p.vx;
          p.y += p.vy;

          p.element.style.transform = `translate(${p.x}px, ${p.y}px)`;
        });

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gsap</title>
    <style>
        html,body{
            height: 100%;
            width: 100%;
            background-color: rgb(146, 146, 146);
        }
        *{
            margin: 0;
            padding: 0;
        }
        .page1 {
              height: 100vh;
              width: 100%;
              background-color: aquamarine;
              display: flex;
              align-items: center;
              justify-content: center;
        }
        .page2 {
              height: 100vh;
              width: 100%;
              background-color: rgb(55, 217, 171);
              display: flex;
              align-items: center;
              justify-content: center;
        }
        .page3 {
              height: 100vh;
              width: 100%;
              background-color: rgb(127, 157, 255);
              display: flex;
              align-items: center;
              justify-content: center;
        }
        .page4 {
              height: 100vh;
              width: 100%;
              background-color: rgb(127, 48, 232);
              display: flex;
              align-items: center;
              justify-content: center;
        }
        .box{
            height: 250px;
            width: 250px;
            border-radius: 10px;
            background-color: tomato;
        }
    </style>
</head>
<body>
    
    <div class="page1"><div class="box"></div></div>
    <div class="page2"><div class="box"></div></div>
    <div class="page3"><div class="box"></div></div>
    <div class="page4"><div class="box"></div></div>

\

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js" integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="APP.JS"></script>
</body>
</html>

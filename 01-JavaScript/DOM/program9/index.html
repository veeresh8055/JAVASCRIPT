<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html,body{
            height: 100%;
            width: 100%;
            padding: 1rem;
            display: flex;
            
           
            
        }
        .main{
            height:100%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
           flex-wrap: wrap;
           padding:1rem ;

        }
        .card{
            height: 350px;
            width: 300px;
            border: 1px solid #161616;
            border-radius: 10px;
            padding: 1rem;
        }
        .img{
            width: 100%;
            height: 60%;
            background-color: gray;
            border-radius:10px ;
            overflow: hidden;

        }
        img{
            height: 100%;
            width: 100%;
            object-fit: cover;
        }
        .content{
            height: 40%;
            width: 100%;
            padding: .5rem;
           display: flex;
           flex-direction: column;
           align-items:start;
           justify-content: center;
           gap: 1rem;
        }
        img:hover{
            scale: 1.1;
            transition: all .5s ease-in-out;
        }
        h2{
            font-size: larger;
            width: 100%;
          font-family: monospace;
          font-weight: 00;
        }
        p{
        opacity: .7;
        }


    </style>
</head>


<body>
    <div class="main">

    </div>
    
    <script src="data.js"></script>
</body>
</html>

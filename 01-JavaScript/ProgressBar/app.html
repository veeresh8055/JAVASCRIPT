<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


.main{
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
justify-content: center;
padding: 1rem;

}

.pogress{
    height: 200px;
    width: 500px;
    display: flex;
    padding: 1rem ;
    background-color: #cfcaca88;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    border-radius: 10px;
}
.outer{
    height: 30px;
    width: 90%;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    
    background-color: #80808055;
    position: relative;
    overflow: hidden;
}
.inner{
    height: 100%;
    width: 0%;
    
    background-color: #88e974;
    position: absolute;
    top: 0;
    left: 0;

}
.content{
    width: 90%;
    display: flex;
    align-items: center;
    justify-content: space-between;
     font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    font-weight: 100;

}

    </style>
</head>
<body>
    <div class="main">

        
        <div class="pogress">
            
            <div class="outer">
                <div class="inner"> </div>
            </div>
            <div class="content">
                <h2 class="download"> Downloading...</h2>
                 <h4 class="progressDisplay">87%</h4>
            </div>
            
        </div>
    </div>
    



    <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        font-family: "Inter";
        background: black;
        overflow: hidden;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
     
      .login{
        height: 500px;
        width: 400px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
    
        
      }
      video{
        height: 100px;
        width: 100px;
        background-color: transparent;
      }
      .google{
        width: 80%;
        display: flex;
        align-items: center;
        border: 1px solid #fdfdfd;
        padding: 10px 30px ;
        border-radius: 10rem;

    }
    .svg{
        height: 30px;
        width: 30px;
        margin-right: 2rem;
        margin-left: -8px;

    }

    .email{
        width: 80%;
        padding: 20px 40px ;
        border: 1px solid #fdfdfd;
        border-radius: 10px;
        color: rgb(195, 191, 191);
        margin-bottom: 1rem;
    }
    button{

          width: 80%;
        padding: 10px 30px ;
        border: 1px solid #fdfdfd;
        border-radius: 50px;
        font-size: 19px;
        font-weight: 600;
        color: rgb(43, 40, 40);
        margin-bottom: 1rem;
    }
    button:hover{
        background-color: #e3e2e2;
        transition: all 1s;
    }
    
    .terms{
        text-align: center;
        width: 100%;
        font-size: 15px;
        color: rgb(190, 190, 190);
         font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        color: rgb(190, 190, 190);
        font-weight: 200;
    }
    .logo{
        position: absolute;
        top: 5%;
        left: 5%;
        height: 100px;
    }
    img{
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
     
    </style>
  </head>
  <body>
   
    <div class="logo">
        <img src="./assets/favicon.ico" alt="">
    </div>

    <div class="login">
        <video  autoplay loop muted playsinline > 
            <source src="./assets/rotate-g.mp4">
        </video>
        <h1 style="font-size: 29px;">Welcome back</h1>

        <div class="google">
            <div class="svg">
                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="LgbsSe-Bz112c"><g><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path><path fill="none" d="M0 0h48v48H0z"></path></g></svg>
            </div>
            <p style="font-size: 15px">Continue with Google</p>

        </div>

         <p style="color: gray;">or</p>

         <div class="email">
            Enter email or username
         </div>

         <button>
            Continue
         </button>

         <p class="terms">By continuing, you agree to our Terms and Privacy Policy.</p>
         <p class="terms">Don't have an account? Sign up</p>
    </div>
   
  </body>
</html>

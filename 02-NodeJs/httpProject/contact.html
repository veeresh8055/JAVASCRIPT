<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        font-family: "Inter";
        background: #fdfdfd;
        color: #161616;
        overflow: hidden;
        background-image: url('./assets/back.png');
        background-position: center;
        background-repeat: no-repeat;
        
      }


      .main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 2rem;
      }

      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-inline: 3rem ;
      }

      .navbar .logo img {
        height: 100px;
      }

      .navbar ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        font-size: 2rem;
        gap: .3rem;
        font-weight: 600;
      }
      li{
        cursor: pointer;
      }
      .navbar ul li:hover{
           color: gray;
           transition: all 1s;
      }

      .text {
        margin-top: auto;
      }

      .text h1 {
        font-size: 8rem;
        line-height: 0.95;
                letter-spacing:-4px;

      }
      span{
        font-family: serif;
        font-weight: 300;
        letter-spacing:-4px;
      }

      .para {
        margin-top: 1rem;
        width: 100%;
        display: flex;
        padding-left: 1rem;
        font-size:1.25rem;
        opacity: 0.9;
      }
      .img{
        position: absolute;
        top: 40%;
        right: 10%;
        height: 300px;
        width: 270px;
        border-radius: 8px;
        overflow: hidden;
      }
      img{
        height: 100%;
        width: 100%;
        object-fit: cover;
      }

     
    </style>
  </head>
  <body>
   

    <div class="main">
      <div class="navbar">
        <div class="logo">
          <img src="./assets/favicon.ico" alt="Logo" />
        </div>
        <ul>
          <li>Home</li>
          <li>Contact</li>
          <li>Login</li>
          <li>Signup</li>
        </ul>
      </div>

      <div class="text">
        <h1 style="font-family: inherit"><span>LET's</span></h1>
        <h1>WORK</h1>
        <h1>TOGETHER</h1>
      </div>

      <div class="img">
        <img src="./assets/office-contact-540x760-crop-q72.jpg" alt="">
      </div>

      <div class="para">
            <p>Send us your enquiry and we’ll respond within 1-2 working days.</p>
      </div>
    </div>

    <hr>
   
  </body>
</html>
